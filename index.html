<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dawn Pavloski Art | New Website Coming Soon</title>
  <meta name="description" content="The new website for Dawn Pavloski Art is on its way.">
  <style>
    :root {
      --bg: #f6f3ee;
      --text: #2b2825;
      --muted: #7a736b;
      --tan: #d9d4cb;
      --accent: #e3a25b;
      --accent-dark: #c9792f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      /* Fallback color shows if the image ever fails to load */
      background-color: var(--tan);
      background-image: url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    main {
      background: var(--bg);
      width: 100%;
      max-width: 560px;
      padding: clamp(40px, 8vw, 72px) clamp(24px, 6vw, 56px);
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }
    .rule {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto 20px;
    }
    p {
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    a {
      display: inline-block;
      margin-top: 32px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    a:hover, a:focus-visible {
      color: var(--accent-dark);
      border-color: var(--accent-dark);
    }
  </style>
</head>
<body>
  <main>
    <h1>Dawn Pavloski Art</h1>
    <div class="rule"></div>
    <p>New website coming soon</p>
    <a href="https://www.instagram.com/dawnpavloski/" target="_blank" rel="noopener">Follow along on Instagram</a>
  </main>
</body>
</html>
